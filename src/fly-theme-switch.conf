# Автосмена темы Fly по времени суток (Astra Linux 1.8 / Fly).
# Время — локальное, формат ЧЧ:ММ.
# День действует в интервале [DAY_START, NIGHT_START); если DAY_START > NIGHT_START,
# интервал считается переходящим через полночь.
DAY_START=08:00
NIGHT_START=20:00

# Id тем Fly (см. fly-theme-apply --list и index.theme темы).
# Днём — светлая версия темы из этого репозитория, ночью — тёмная.
# Можно указать и штатную AstraProximaLight, но при смене на тёмную
# возможно появление светлой 1 px кромки до перезапуска fly-wm.
DAY_THEME=Astra18FlyLight
NIGHT_THEME=Astra18FlyDark

# Период проверки времени в демоне, секунды (минимум 10).
CHECK_INTERVAL=60
